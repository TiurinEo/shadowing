cat > docker-compose.yml <<'EOF'
services:
  shadowing:
    build: .
    container_name: shadowing
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "8000"
    volumes:
      - ./models:/models:ro
      - hf-cache:/root/.cache/huggingface

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "8444:8444"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - shadowing

volumes:
  hf-cache:
EOF